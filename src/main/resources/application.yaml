# Hosts like Render assign the port at runtime via $PORT; 8080 locally.
server:
  port: ${PORT:8080}

spring:
  application:
    name: store
  datasource:
    url: "${DB_URL}"
    username: "${POSTGRES_USER}"
    password: "${POSTGRES_PASSWORD}"
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        default_batch_fetch_size: 20
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml