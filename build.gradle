plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.2'
    id 'io.spring.dependency-management' version '1.1.3'
    id 'org.liquibase.gradle' version '2.2.0'
    id 'com.diffplug.spotless' version '6.25.0'
    id 'jacoco'
}

group = 'com.example'
version = '1.0.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

spotless {
    java {
        palantirJavaFormat('2.50.0')
                .style('PALANTIR')
                .formatJavadoc(true)
        importOrder('com', 'jakarta', 'lombok', 'org', '', 'javax|java', '\\#')
        removeUnusedImports()
        formatAnnotations()
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.liquibase:liquibase-core'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    implementation 'org.mapstruct:mapstruct:1.6.2'
    implementation 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.2'

    //Loads .env into Spring's Environment so local runs (mvn spring-boot:run,IDE run configs)
    developmentOnly 'me.paulschwarz:springboot3-dotenv:5.1.0'

    // Test dependencies
    testCompileOnly 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.mapstruct:mapstruct-processor:1.6.2'
    testImplementation 'org.mapstruct:mapstruct:1.6.2'

    // Core Testcontainers Platform + PostgreSQL module
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'

}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.jacocoTestReport
    exclude 'com/example/store/integration/**'
}

tasks.jacocoTestCoverageVerification {
    dependsOn tasks.test // Enforces that tests must execute first

    violationRules {
        rule {
            element = 'CLASS' // Checks coverage criteria on a class-by-class level

            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.80 // 80% minimum line coverage requirement rule threshold
            }

            // Exclude non-business logic classes from failing the build limits
            excludes = [
                    '*.StoreApplication',
                    '*.dto.*',
                    '*.mapper.*'
            ]
        }
    }
}

tasks.jacocoTestReport {
    dependsOn tasks.test // Ensure tests run before generating the report
    finalizedBy tasks.jacocoTestCoverageVerification

    reports {
        html.required.set(true)
    }
    afterEvaluate {
        classDirectories = files(classDirectories.files.collect {
            fileTree(dir: it,
                    exclude: ['**/mapper/**', '**/StoreApplication.class'])
        })
    }
}

tasks.register('integrationTest', Test) {
    description = 'Runs the heavy Testcontainers PostgreSQL integration tests.'
    group = 'verification'

    include 'com/example/store/integration/**'

    useJUnitPlatform()
}