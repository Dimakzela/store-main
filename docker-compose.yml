# Local development / manual verification of the image the CI pipeline builds.
#
#   docker compose up --build
#   curl http://localhost:8080/actuator/health
#
# To run against an image already published by CI instead of building locally:
#   IMAGE=ghcr.io/<owner>/<repo>:latest docker compose up

services:
  postgres:
    image: postgres:16.2
    command: postgres -c wal_level=logical
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: store
    ports:
      - "5433:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d store"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres: